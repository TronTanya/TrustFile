[server]
# Лимит на один файл в МБ; согласован с MAX_FILE_SIZE в hashing.py.
maxUploadSize = 20
headless = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#315EFB"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202733"
borderColor = "#E4E7EC"
showWidgetBorder = true
linkColor = "#315EFB"
greenColor = "#278451"
orangeColor = "#B7791F"
yellowColor = "#B7791F"
redColor = "#C43D3D"
blueColor = "#315EFB"
grayColor = "#667085"
codeBackgroundColor = "#F7F8FA"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "small"
buttonRadius = "small"
